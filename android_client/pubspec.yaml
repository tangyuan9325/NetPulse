name: netpulse_mobile
description: NetPulse Android Client - Network stress testing and performance monitoring tool
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fluent_ui: ^4.8.0
  provider: ^6.1.1
  http: ^1.1.0
  connectivity_plus: ^6.1.0
  network_info_plus: ^6.0.0
  permission_handler: ^11.1.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  intl: ^0.20.2
  uuid: ^4.2.1
  crypto: ^3.0.3
  path_provider: ^2.1.1
  package_info_plus: ^9.0.1
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
